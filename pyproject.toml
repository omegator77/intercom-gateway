[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intercom-gateway"
version = "0.2.0"
description = "Headless gateway between sound card channels (e.g. Dante Virtual Soundcard) and intercom lines"
requires-python = ">=3.11"
dependencies = [
  "aiortc>=1.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "sounddevice>=0.4.7",
]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.7", "keyring>=24"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
intercom-gateway = "gateway.__main__:main"

[project.gui-scripts]
intercom-gateway-ui = "gateway.ui.app:main"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
