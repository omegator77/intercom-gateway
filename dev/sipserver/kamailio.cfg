#!KAMAILIO
#
# Local SIP registrar / proxy for testing the intercom SIP bridge. Signalling only: the audio always flows
# directly between the two ends, so every codec (Layer II, dual-mono, later AAC) passes through unchanged.
#
#   * REGISTER and INVITE need a password (digest, realm "sip.local"); the users live in users.cfg
#   * a call can only go to somebody who is registered; there is no relaying to other servers
#   * a small web interface is served on tcp/8080: /RPC (Kamailio's own command page) and /jsonrpc
#
# Not meant for the internet as it is: no flood protection, no TLS, no rate limits.

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=yes
children=4
auto_aliases=no
tcp_accept_no_cl=yes
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:8080

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "auth.so"
loadmodule "htable.so"
loadmodule "dialog.so"
loadmodule "xhttp.so"
loadmodule "xhttp_rpc.so"

modparam("jsonrpcs", "pretty_format", 1)
modparam("jsonrpcs", "transport", 7)
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")
modparam("tm", "failure_reply_mode", 3)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("auth", "nonce_expire", 600)
modparam("auth", "nonce_count", 1)
modparam("htable", "htable", "cred=>size=6;autoexpire=0")
modparam("dialog", "enable_stats", 1)
modparam("dialog", "default_timeout", 14400)
modparam("dialog", "ka_timer", 10)
modparam("dialog", "ka_interval", 30)
modparam("xhttp_rpc", "xhttp_rpc_root", "RPC")

# passwords are loaded from users.cfg at start; the admin page changes them at runtime as well
event_route[htable:mod-init] {
#!include_file "data/users.cfg"
}

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "malformed SIP message from $si:$sp\n");
		exit;
	}

	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "OK");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	# requests inside a call
	if (has_totag()) {
		if (loose_route()) {
			if (is_method("BYE")) {
				dlg_manage();
			}
			route(RELAY);
		} else {
			if (is_method("ACK")) {
				if (t_check_trans()) {
					route(RELAY);
				}
				exit;
			}
			sl_send_reply("404", "Not here");
		}
		exit;
	}

	if (is_method("REGISTER")) {
		route(AUTH);
		if (!save("location")) {
			sl_reply_error();
		}
		exit;
	}

	if (!is_method("INVITE|MESSAGE|OPTIONS")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	route(AUTH);
	if (is_method("INVITE")) {
		dlg_manage();
		dlg_set_property("ka-src");   # dead calls (a device that vanished without BYE) are noticed and removed
		dlg_set_property("ka-dst");
	}
	record_route();

	if ($rU == $null) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}
	if (!lookup("location")) {
		t_newtran();
		t_reply("404", "Not registered");
		exit;
	}
	route(RELAY);
	exit;
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

route[AUTH] {
	if (!is_present_hf("Authorization") && !is_present_hf("Proxy-Authorization")) {
		auth_challenge("sip.local", "1");
		exit;
	}
	$var(pw) = $sht(cred=>$au);
	if ($var(pw) == $null) {
		xlog("L_NOTICE", "unknown user $au from $si\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	$var(rc) = pv_auth_check("sip.local", "$var(pw)", "0", "0");
	if ($var(rc) < 0) {
		if ($var(rc) == -2) {
			auth_challenge("sip.local", "1");
		} else {
			xlog("L_NOTICE", "wrong password for $au from $si (rc $var(rc))\n");
			sl_send_reply("403", "Forbidden");
		}
		exit;
	}
	consume_credentials();
}

event_route[xhttp:request] {
	if ($hu =~ "^/RPC") {
		dispatch_xhttp_rpc();
		exit;
	}
	if ($hu =~ "^/jsonrpc") {
		jsonrpc_dispatch();
		exit;
	}
	xhttp_reply("404", "Not Found", "text/plain", "not found\n");
}
