# Intercom-Client - Beispiel. Normalerweise legt die Oberfläche (intercom-client) diese Datei selbst an.
# Das Passwort steht NICHT hier, sondern im Windows-Anmeldeinformationsspeicher.

[server]
url = "https://intercom.example.org"
username = "anna"            # die anderen sehen dich unter dem Namen deines Kontos (Alias in den User Settings)

[audio]
# input_device = "Headset"   # Teil des Gerätenamens; ohne Eintrag: Systemstandard
# output_device = "Headset"
input_channel = 0
output_channels = [0, 1]
mic_gain_db = 0.0
playout_ms = 60
# Aufbereitung des Mikrofons (alles aus = unverändert, für Headset):
# echo_cancellation = false  # true bei Lautsprechern statt Kopfhörer
# noise_suppression = 0      # 0 aus, 1 niedrig, 2 mittel, 3 hoch, 4 sehr hoch
# auto_gain = false          # Auto-Pegel: regelt die Sprache auf einen festen Pegel
# agc_target_dbfs = -20      # Ziel-Pegel der Sprache (-35..-10)
# agc_max_gain_db = 25       # so viel hebt der Auto-Pegel höchstens an (0..40)

[dim]                        # Programm-Leitung absenken (Standardwerte wie in der Web-App)
# amount_db = -14            # 0 = nie dimmen
# when_addressed = true      # wenn dich jemand in einer anderen Leitung anspricht
# while_speaking = true      # wenn du in einer anderen Leitung sprichst
# delay_ms = 1000            # so lange muss gesprochen werden / so lange bleibt das Dimmen

[companion]                  # Stream Deck über Bitfocus Companion (Modul "Eyevinn: Open Intercom")
# url = "ws://127.0.0.1:12345"

[hotkeys]
global_mute = "ctrl+alt+m"   # Mikrofon in allen Leitungen aus/an

[[line]]
name = "Regie"
production_id = "4"
line_id = "1"
volume = 100                 # Prozent, 0..150
ptt_key = "f1"               # Sprechen, solange die Taste gehalten wird
latch_key = "shift+f1"       # Dauer-Sprechen ein/aus

[[line]]
name = "Technik"
production_id = "4"
line_id = "2"
volume = 80
ptt_key = "f2"
latch_key = "shift+f2"
# autoconnect = false        # diese Leitung beim Start nicht verbinden (wird auch automatisch gesetzt,
#                            # wenn du sie im Fenster getrennt lässt)
